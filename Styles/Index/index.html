<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Salle Mollerussa - Accés</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="desktop-wrapper">
        <div class="container">
            <div class="left-side" id="mainContainer">
                <div class="overlay-text">
                    <h1 class="title-black">
                        LA SALLE 
                        <img src="../estrella.png" class="star-img" alt="Estrella">
                    </h1>
                    <h1 class="title-black">MOLLERUSSA</h1>
                    <h2 class="subtitle-white">ADMINISTRADOR D'ESDEVENIMENTS</h2>
                </div>
            </div>

            <div class="right-side">
                <h2 class="form-title">Iniciar sessió</h2>
                
                <div class="input-fields">
                    <div class="field">
                        <label>Nom d'usuari o correu electrònic</label>
                        <input type="text" placeholder="Ex: alumne@lasalle.cat">
                    </div>
                    <div class="field">
                        <label>Contrasenya</label>
                        <input type="password" placeholder="••••••••">
                    </div>
                </div>

                <p class="separator">o inicia sessió amb</p>
                
                <div class="social-actions">
                    <button class="social-btn">
                        <img src="https://cdn-icons-png.flaticon.com/128/300/300221.png" alt="Google"> 
                        Google
                    </button>
                </div>

                <button class="login-submit">INICIAR SESSIÓ</button>
                
                <p class="footer-link">
                    Si no tens compte, <a href="#">Registra't</a>
                </p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
