<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Esdeveniment - La Salle Mollerussa</title>
    <link rel="stylesheet" href="crear_esdeveniments.css">
</head>
<body>
    <div class="desktop-wrapper">
        <div class="main-container">
            <div class="left-panel" id="starContainer">
                <div class="brand-content">
                    <h1 class="main-title">
                        LA SALLE 
                        <img src="../estrella.png" class="floating-star" alt="★">
                    </h1>
                    <h1 class="main-title">MOLLERUSSA</h1>
                    <h2 class="admin-subtitle">ADMINISTRADOR D'ESDEVENIMENTS</h2>
                </div>
            </div>

            <div class="right-panel scrollable">
                <div class="form-box">
                    <h1 class="form-heading-black">CREAR<br>ESDEVENIMENTS</h1>
                    
                    <form class="creation-form">
                        <div class="input-group">
                            <label>Tipus de esdeveniments</label>
                            <input type="text" placeholder="...">
                        </div>
                        <div class="input-group">
                            <label>Numero de invitats</label>
                            <input type="number" placeholder="0">
                        </div>
                        <div class="input-group">
                            <label>Ubicació</label>
                            <input type="text" placeholder="Lloc de l'acte">
                        </div>
                        <div class="input-group">
                            <label>Data de l’esdeveniment</label>
                            <input type="date">
                        </div>
                        <div class="input-group">
                            <label>Hora inici esdeveniment</label>
                            <input type="time">
                        </div>
                        <div class="input-group">
                            <label>Data limit de confiramacio</label>
                            <input type="date">
                        </div>
                        
                        <div class="button-container">
                            <button type="submit" class="save-btn">GUARDAR</button>
                        </div>
                    </form>

                    <p class="back-link">
                        <a href="menu_admin.html"><span><</span> Tornar enrere</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
