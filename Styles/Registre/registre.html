<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre - La Salle Mollerussa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="desktop-wrapper">
        <div class="main-container">
            <div class="left-panel" id="starContainer">
                <div class="brand-content">
                    <h1 class="main-title">
                        LA SALLE 
                        <img src="../estrella.png" class="floating-star" alt="estrella">
                    </h1>
                    <h1 class="main-title">MOLLERUSSA</h1>
                    <h2 class="admin-subtitle">ADMINISTRADOR D'ESDEVENIMENTS</h2>
                </div>
            </div>

            <div class="right-panel">
                <div class="form-box">
                    <h1 class="form-heading-black">REGISTRE</h1>
                    
                    <form class="registration-form">
                        <div class="input-group">
                            <label>Nom :</label>
                            <input type="text" placeholder="El teu nom">
                        </div>
                        <div class="input-group">
                            <label>Correu :</label>
                            <input type="email" placeholder="correu@exemple.com">
                        </div>
                        <div class="input-group">
                            <label>Telefon :</label>
                            <input type="tel" placeholder="000 000 000">
                        </div>
                        <div class="input-group">
                            <label>Contrasenya :</label>
                            <input type="password" placeholder="********">
                        </div>
                        <div class="input-group">
                            <label>Repetir Contrasenya :</label>
                            <input type="password" placeholder="********">
                        </div>
                        
                        <div class="login-redirect">
                            <span>O Inicia Sessió:</span>
                            <button type="submit" class="log-in-btn">LOG IN</button>
                        </div>
                    </form>

                    <p class="back-link">
                        <a href="index.html"> < Tornar enrere</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
